name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Diff engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run the diff tests
        run: node test/diff.test.js

  build:
    name: Plugin (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and package
        shell: pwsh
        run: .\build.ps1 -Arch x64 -Package

      - name: Check the package the way Plugins Admin will
        shell: pwsh
        run: |
          $dll = 'dist\x64\MarkdownPeek\MarkdownPeek.dll'
          if (-not (Test-Path $dll)) { throw "$dll was not produced" }

          # A DLL with no version resource is rejected outright by the
          # plugin-list validator, and the version has to match Version.h.
          $ver = (Get-Item $dll).VersionInfo.FileVersion
          if (-not $ver) { throw 'The DLL carries no FileVersion resource.' }
          $expected = (Select-String -Path src\Version.h -Pattern 'MDPEEK_VER_STRING\s+"([^"]+)"').Matches[0].Groups[1].Value
          if ($ver -ne $expected) { throw "FileVersion is $ver but Version.h says $expected." }

          # The assets have to carry the stamp the plugin refreshes against.
          if (-not (Test-Path 'dist\x64\MarkdownPeek\assets\VERSION')) { throw 'assets\VERSION is missing' }

          # The DLL must sit at the root of the archive or Plugins Admin will
          # not find it.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Get-ChildItem 'dist\MarkdownPeek-*-x64.zip' | Select-Object -First 1).FullName
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          $atRoot = @($zip.Entries | Where-Object { $_.FullName.ToLower() -eq 'markdownpeek.dll' }).Count -eq 1
          $zip.Dispose()
          if (-not $atRoot) { throw 'MarkdownPeek.dll is not at the root of the zip.' }

          $size = [math]::Round((Get-Item $dll).Length / 1KB)
          Write-Host "MarkdownPeek.dll  ${size} KiB  version $ver"

      - uses: actions/upload-artifact@v7
        with:
          name: MarkdownPeek-x64
          path: dist/x64/MarkdownPeek
          if-no-files-found: error
